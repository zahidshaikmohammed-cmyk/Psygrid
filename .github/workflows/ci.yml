name: Psygrid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - run: PYTHONPATH=. pytest -q tests/test_core.py tests/test_state.py tests/test_1m_contract.py tests/test_live_safety.py tests/test_hardening.py tests/test_universe_contract.py tests/test_dhan_990_resolution.py tests/test_index_layer_contract.py tests/test_index_resolution.py
