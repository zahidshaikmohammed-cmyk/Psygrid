name: Psygrid Production Deploy to Oracle

# Master Indicator deployment checkpoint enabled.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: psygrid-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run canonical 1-minute tests
        run: PYTHONPATH=. pytest -q tests/test_core.py tests/test_state.py tests/test_1m_contract.py tests/test_live_safety.py tests/test_hardening.py tests/test_universe_contract.py tests/test_dhan_990_resolution.py tests/test_master_indicator.py tests/test_indicator_runtime.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/psygrid_oracle
          chmod 600 ~/.ssh/psygrid_oracle

          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/psygrid_oracle ubuntu@140.245.226.102 <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/Psygrid

          git fetch origin main
          git reset --hard origin/main

          /home/ubuntu/Psygrid/.venv/bin/pip install -r requirements.txt
          /home/ubuntu/Psygrid/.venv/bin/python -m py_compile app.py

          sudo systemctl daemon-reload
          if ! sudo iptables -C INPUT -p tcp --dport 10000 -j ACCEPT 2>/dev/null; then
            sudo iptables -I INPUT 5 -p tcp --dport 10000 -j ACCEPT
          fi
          sudo systemctl restart psygrid

          health_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo
              health_ok=1
              break
            fi
            sleep 2
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "Psygrid health check failed after 60 seconds" >&2
            echo "--- systemd status ---" >&2
            sudo systemctl status psygrid --no-pager || true
            echo "--- recent Psygrid journal ---" >&2
            sudo journalctl -u psygrid -n 200 --no-pager || true
            echo "--- listener ---" >&2
            sudo ss -lntp | grep ':10000' || true
            echo "--- firewall ---" >&2
            sudo iptables -L INPUT -n --line-numbers | grep 10000 || true
            exit 1
          fi

          echo "Initial health check passed; verifying process stability for 60 seconds..."
          sleep 60
          if ! curl -fsS http://127.0.0.1:10000/health; then
            echo >&2
            echo "Psygrid became unhealthy after initial startup" >&2
            echo "--- systemd status ---" >&2
            sudo systemctl status psygrid --no-pager || true
            echo "--- recent Psygrid journal ---" >&2
            sudo journalctl -u psygrid -n 300 --no-pager || true
            echo "--- listener ---" >&2
            sudo ss -lntp | grep ':10000' || true
            echo "--- firewall ---" >&2
            sudo iptables -L INPUT -n --line-numbers | grep 10000 || true
            exit 1
          fi
          echo
          echo "Psygrid stability check passed."
          echo "--- listener ---"
          sudo ss -lntp | grep ':10000' || true
          echo "--- firewall ---"
          sudo iptables -L INPUT -n --line-numbers | grep 10000 || true
          REMOTE

          echo "Checking public Psygrid health from the deployment runner..."
          public_ok=0
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 http://140.245.226.102:10000/health; then
              echo
              public_ok=1
              break
            fi
            sleep 2
          done
          if [ "$public_ok" -ne 1 ]; then
            echo "Public Psygrid health check failed from deployment runner" >&2
            exit 1
          fi

          echo "Waiting for Psygrid to become LIVE before the market-hours checkpoint..."
          live_ok=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://140.245.226.102:10000/ready >/tmp/psygrid-ready.json; then
              echo
              live_ok=1
              break
            fi
            sleep 2
          done
          if [ "$live_ok" -ne 1 ]; then
            echo "Psygrid did not reach LIVE readiness within 120 seconds" >&2
            cat /tmp/psygrid-ready.json 2>/dev/null || true
            exit 1
          fi

          echo "Running LIVE 990-stock endpoint universe integrity checkpoint..."
          PSYGRID_BASE_URL=http://140.245.226.102:10000 python tools/check_live_universe.py

          echo "Waiting for Master Indicator layer to reach full 990-stock synchronization..."
          indicator_ok=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 10 http://140.245.226.102:10000/public/indicators.json >/tmp/psygrid-indicators.json; then
              if python - <<'PY'
import json
with open('/tmp/psygrid-indicators.json', encoding='utf-8') as f:
    p = json.load(f)
raise SystemExit(0 if p.get('status') == 'OK' and p.get('stock_count') == 990 else 1)
PY
              then
                echo "Master Indicator: 990/990 synchronized."
                indicator_ok=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$indicator_ok" -ne 1 ]; then
            echo "Master Indicator layer did not reach 990/990 within 180 seconds" >&2
            cat /tmp/psygrid-indicators.json 2>/dev/null || true
            exit 1
          fi

          echo "Master Indicator production checkpoint passed."

