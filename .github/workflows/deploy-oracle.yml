name: Psygrid Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: psygrid-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run canonical 1-minute tests
        run: PYTHONPATH=. pytest -q tests/test_core.py tests/test_state.py tests/test_1m_contract.py tests/test_live_safety.py tests/test_hardening.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/psygrid_oracle
          chmod 600 ~/.ssh/psygrid_oracle

          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/psygrid_oracle ubuntu@140.245.226.102 <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/Psygrid

          git fetch origin main
          git reset --hard origin/main

          /home/ubuntu/Psygrid/.venv/bin/pip install -r requirements.txt
          /home/ubuntu/Psygrid/.venv/bin/python -m py_compile app.py

          sudo systemctl daemon-reload
          if ! sudo iptables -C INPUT -p tcp --dport 10000 -j ACCEPT 2>/dev/null; then
            sudo iptables -I INPUT 5 -p tcp --dport 10000 -j ACCEPT
          fi
          sudo systemctl restart psygrid

          health_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo
              health_ok=1
              break
            fi
            sleep 2
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "Psygrid health check failed after 60 seconds" >&2
            echo "--- systemd status ---" >&2
            sudo systemctl status psygrid --no-pager || true
            echo "--- recent Psygrid journal ---" >&2
            sudo journalctl -u psygrid -n 200 --no-pager || true
            echo "--- listener ---" >&2
            sudo ss -lntp | grep ':10000' || true
            echo "--- firewall ---" >&2
            sudo iptables -L INPUT -n --line-numbers | grep 10000 || true
            exit 1
          fi

          echo "Initial health check passed; verifying process stability for 60 seconds..."
          sleep 60
          if ! curl -fsS http://127.0.0.1:10000/health; then
            echo >&2
            echo "Psygrid became unhealthy after initial startup" >&2
            echo "--- systemd status ---" >&2
            sudo systemctl status psygrid --no-pager || true
            echo "--- recent Psygrid journal ---" >&2
            sudo journalctl -u psygrid -n 300 --no-pager || true
            echo "--- listener ---" >&2
            sudo ss -lntp | grep ':10000' || true
            echo "--- firewall ---" >&2
            sudo iptables -L INPUT -n --line-numbers | grep 10000 || true
            exit 1
          fi
          echo
          echo "Psygrid stability check passed."
          echo "--- listener ---"
          sudo ss -lntp | grep ':10000' || true
          echo "--- firewall ---"
          sudo iptables -L INPUT -n --line-numbers | grep 10000 || true

          echo "Inspecting Oracle-local service identity and local endpoint responses..."
          echo "--- systemctl show ---"
          sudo systemctl show psygrid -p MainPID -p ExecStart -p WorkingDirectory --no-pager
          pid="$(sudo systemctl show psygrid -p MainPID --value)"
          if [ -n "$pid" ] && [ "$pid" != "0" ]; then
            echo "--- process command line ---"
            sudo tr '\0' ' ' < "/proc/$pid/cmdline"; echo
            echo "--- process cwd ---"
            sudo readlink "/proc/$pid/cwd"
          fi
          echo "--- local root ---"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' http://127.0.0.1:10000/
          echo
          echo "--- local live-a ---"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' http://127.0.0.1:10000/public/live-a.json | /home/ubuntu/Psygrid/.venv/bin/python -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps({"top_keys":sorted(p),"status":p.get("status"),"error":p.get("error"),"schema_version":p.get("schema_version"),"stock_count":p.get("stock_count"),"stocks_type":type(p.get("stocks")).__name__}, separators=(",",":")))'
          echo
          echo "--- local full ---"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' http://127.0.0.1:10000/public/live.json | /home/ubuntu/Psygrid/.venv/bin/python -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps({"top_keys":sorted(p),"status":p.get("status"),"error":p.get("error"),"schema_version":p.get("schema_version"),"stock_count":p.get("stock_count"),"stocks_type":type(p.get("stocks")).__name__}, separators=(",",":")))'
          REMOTE

          echo "Checking public Psygrid health from the deployment runner..."
          public_ok=0
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 5 http://140.245.226.102:10000/health; then
              echo
              public_ok=1
              break
            fi
            sleep 2
          done
          if [ "$public_ok" -ne 1 ]; then
            echo "Public Psygrid health check failed from deployment runner" >&2
            exit 1
          fi

          echo "Inspecting public endpoint schemas before integrity checkpoint..."
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://140.245.226.102:10000"
          for path in ["/", "/public/live-a.json", "/public/live.json"]:
              request = Request(base + path, headers={"Cache-Control": "no-cache", "User-Agent": "psygrid-deploy-schema-check/1.0"})
              with urlopen(request, timeout=15) as response:
                  raw = response.read()
                  payload = json.loads(raw.decode("utf-8"))
              print(f"SCHEMA {path}: top_keys={sorted(payload.keys())}")
              print(f"SCHEMA {path}: service={payload.get('service')!r} status={payload.get('status')!r} error={payload.get('error')!r} schema_version={payload.get('schema_version')!r} stock_count={payload.get('stock_count')!r} stocks_type={type(payload.get('stocks')).__name__!r}")
          PY

          echo "Running LIVE 450-stock endpoint universe integrity checkpoint..."
          PSYGRID_BASE_URL=http://140.245.226.102:10000 python tools/check_live_universe.py
