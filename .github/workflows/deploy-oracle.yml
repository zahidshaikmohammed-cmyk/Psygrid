name: Psygrid Deploy to Oracle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Run full test suite
        run: python -m pytest -q

      - name: Deploy to Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/psygrid_oracle
          chmod 600 ~/.ssh/psygrid_oracle
          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/psygrid_oracle ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/Psygrid
          git fetch origin main
          git reset --hard origin/main
          /home/ubuntu/Psygrid/.venv/bin/pip install -r requirements.txt
          /home/ubuntu/Psygrid/.venv/bin/python -m py_compile app.py runtime_guard.py
          # Restart policy, watchdog, fd limit, priority over downstream services, bounded journal.
          sudo bash deploy/harden_psygrid.sh
          if ! sudo iptables -C INPUT -p tcp --dport 10000 -j ACCEPT 2>/dev/null; then
            sudo iptables -I INPUT 5 -p tcp --dport 10000 -j ACCEPT
          fi
          sudo systemctl restart psygrid
          health_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo
              health_ok=1
              break
            fi
            sleep 2
          done
          test "$health_ok" -eq 1
          sleep 10
          health="$(curl -fsS http://127.0.0.1:10000/health)"
          echo "$health"
          # The new process must run with the raised descriptor limit and a sane status.
          printf '%s' "$health" | /home/ubuntu/Psygrid/.venv/bin/python -c '
          import json, sys
          h = json.load(sys.stdin)
          p = h["process"]
          assert h["status"] in {"OK", "DEGRADED"}, h["status"]
          assert p["fd_limit"] is None or p["fd_limit"] >= 65536, p
          assert p["fd_usage_ratio"] is None or p["fd_usage_ratio"] < 0.2, p
          print("health:", h["status"], h["reasons"], "fds", p["open_fds"], "/", p["fd_limit"])
          '
          REMOTE

      - name: Verify public health
        run: curl -fsS --max-time 10 http://140.245.226.102:10000/health

      - name: Verify 16 index endpoints
        env:
          PSYGRID_BASE_URL: http://140.245.226.102:10000
        run: |
          set -euo pipefail
          for endpoint in nifty banknifty sensex nifty500 niftymidcap100 niftysmallcap100 finnifty indiavix niftyit niftyauto niftypharma niftymetal niftyfmcg niftyrealty niftyenergy niftyinfra; do
            payload="$(curl -sS --max-time 10 "${PSYGRID_BASE_URL}/public/${endpoint}.json")"
            echo "${endpoint}: ${payload:0:180}"
            case "${payload}" in
              *'"status":"INDEX_LAYER_UNAVAILABLE"'*|*'"status":"INDEX_DATA_UNAVAILABLE"'*)
                echo "INDEX ENDPOINT FAILED: ${endpoint}"
                exit 1
                ;;
            esac
          done

      - name: Verify 990-stock universe
        env:
          PSYGRID_BASE_URL: http://140.245.226.102:10000
        run: python tools/check_live_universe.py

      # The intelligence service is separate from PSYGRID: it is installed and checked only after
      # every PSYGRID check above has passed, and nothing below restarts or reconfigures `psygrid`.
      - name: Deploy intelligence service
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/psygrid_oracle ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/Psygrid
          mkdir -p /home/ubuntu/psygrid-intelligence
          /home/ubuntu/Psygrid/.venv/bin/python -c "import intelligence.api"
          # Never compete for a port another process holds: stop our own service, then require the port free.
          sudo systemctl stop psygrid-intelligence 2>/dev/null || true
          if sudo ss -ltnpH "( sport = :18101 )" | grep -q .; then
            echo "Port 18101 is in use by another process; psygrid-intelligence will not be started:"
            sudo ss -ltnpH "( sport = :18101 )"
            sudo systemctl disable psygrid-intelligence 2>/dev/null || true
            exit 1
          fi
          sudo install -m 0644 deploy/psygrid-intelligence.service /etc/systemd/system/psygrid-intelligence.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed psygrid-intelligence 2>/dev/null || true
          sudo systemctl enable psygrid-intelligence
          sudo systemctl restart psygrid-intelligence
          health_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18101/v2/health; then
              echo
              health_ok=1
              break
            fi
            sleep 2
          done
          if [ "$health_ok" -ne 1 ]; then
            sudo journalctl -u psygrid-intelligence -n 40 --no-pager || true
            exit 1
          fi
          # PSYGRID must still be healthy with the intelligence service running beside it.
          curl -fsS http://127.0.0.1:10000/health
          echo
          REMOTE
