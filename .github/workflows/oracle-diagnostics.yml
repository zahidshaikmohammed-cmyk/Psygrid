name: Oracle diagnostics and acceptance

# Inspection of the Oracle VM plus PSYGRID acceptance checks. It never restarts,
# stops, edits or deletes anything belonging to PSYGRID. The only state change is
# the isolation test: it stops psygridevents (downstream), confirms PSYGRID keeps
# serving, and starts psygridevents again. Runs on push to this branch only.
on:
  push:
    branches: [ops/oracle-diagnostics]
    paths: [".github/workflows/oracle-diagnostics.yml"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VM (read-only)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/k -o BatchMode=yes ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -uo pipefail
          sec(){ echo; echo "===== $* ====="; }
          sec date; date -u; uptime
          sec "systemctl cat psygrid"; systemctl cat psygrid --no-pager
          sec "service state"; systemctl show psygrid -p MainPID -p ActiveState -p SubState -p NRestarts -p ActiveEnterTimestamp -p LimitNOFILE -p LimitNOFILESoft -p MemoryCurrent -p TasksCurrent
          PID=$(systemctl show -p MainPID --value psygrid)
          echo "PID=$PID"
          if [ -n "$PID" ] && [ "$PID" != 0 ]; then
            sec "process"; ps -o pid,etime,rss,nlwp,cmd -p "$PID"
            sec "open files limit"; grep -i "open files" /proc/$PID/limits
            sec "fd count"; ls /proc/$PID/fd | wc -l
            sec "fd kinds"; for f in /proc/$PID/fd/*; do readlink "$f"; done 2>/dev/null | sed -E 's/\[[0-9]+\]//; s#^/.*#file#' | sort | uniq -c | sort -rn | head
            sec "threads"; ls /proc/$PID/task | wc -l
          fi
          sec "listen socket 10000"; sudo ss -ltnp "( sport = :10000 )"
          sec "tcp states to :10000"; sudo ss -tan "( sport = :10000 )" | awk 'NR>1{print $1}' | sort | uniq -c
          sec "curl /health"; curl -sS -m 8 -o /tmp/h.json -w "http=%{http_code} time=%{time_total}\n" http://127.0.0.1:10000/health; head -c 600 /tmp/h.json 2>/dev/null; echo
          sec "curl /public/live-a.json"; curl -sS -m 8 -o /dev/null -w "http=%{http_code} size=%{size_download}\n" http://127.0.0.1:10000/public/live-a.json
          sec "journal counts since boot of unit"; SINCE=$(systemctl show -p ActiveEnterTimestamp --value psygrid)
          echo "since: $SINCE"
          for p in "deallocating an open event loop" "Too many open files" "Errno 24" "Traceback" "RECONNECTING" "No market-feed quote packets"; do
            printf '%-40s %s\n' "$p" "$(sudo journalctl -u psygrid --since "$SINCE" --no-pager 2>/dev/null | grep -c "$p")"
          done
          sec "first 'Too many open files'"; sudo journalctl -u psygrid --since "$SINCE" --no-pager | grep -m3 "Too many open files"
          sec "first 'deallocating'"; sudo journalctl -u psygrid --since "$SINCE" --no-pager | grep -m2 "deallocating an open event loop"
          sec "journal tail"; sudo journalctl -u psygrid -n 40 --no-pager
          sec "other services"; for u in psygrid-intelligence psygridevents; do systemctl show $u -p ActiveState -p MemoryCurrent -p MainPID 2>/dev/null; done
          sec "memory"; free -m
          sec "disk"; df -h / /home 2>/dev/null
          sec "journal disk"; sudo journalctl --disk-usage
          sec "du /home/ubuntu (depth 2)"; du -xh --max-depth=2 /home/ubuntu 2>/dev/null | sort -h | tail -25
          sec "du /var/log"; sudo du -xh --max-depth=1 /var/log 2>/dev/null | sort -h | tail -10
          sec "du caches"; du -sh ~/.cache/* 2>/dev/null | sort -h | tail; sudo du -sh /var/cache/apt 2>/dev/null
          sec "Psygrid env keys (names only)"; for f in $(systemctl show -p EnvironmentFiles --value psygrid | awk '{print $1}' | tr -d '-'); do echo "$f:"; sudo sed -E 's/=.*/=<redacted>/' "$f" 2>/dev/null; done
          sec "Psygrid git"; git -C /home/ubuntu/Psygrid log --oneline -3
          sec "systemd hardening"; systemctl show psygrid -p Restart -p WatchdogUSec -p NotifyAccess -p LimitNOFILE -p OOMScoreAdjust -p CPUWeight -p IOWeight -p MemoryLow -p NRestarts
          sec "watchdog events"; sudo journalctl -u psygrid --since "$SINCE" --no-pager | grep -ci "watchdog timeout" || true
          sec "full /health"; curl -sS -m 8 http://127.0.0.1:10000/health | python3 -m json.tool
          sec "endpoint acceptance"; python3 - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base = "http://127.0.0.1:10000"
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          def get(path):
              t = time.monotonic()
              with urllib.request.urlopen(base + path, timeout=15) as r:
                  body = r.read()
                  return r.status, json.loads(body), round((time.monotonic() - t) * 1000), len(body)
          fails = []
          status, live, ms, size = get("/public/live.json")
          stocks = live.get("stocks") or {}
          print(f"/public/live.json http={status} {ms}ms {size}B stocks={len(stocks)} keys={sorted(live)[:12]}")
          seen = []
          future = 0
          for shard in "abcdefghijklmnopqrstuv":
              st, body, ms, size = get(f"/public/live-{shard}.json")
              sym = list((body.get("stocks") or {}).keys())
              seen += sym
              for rec in (body.get("stocks") or {}).values():
                  for c in rec.get("candles_1m") or []:
                      ts = c.get("timestamp")
                      when = datetime.fromisoformat(ts.replace(" IST", "")) if ts else None
                      if when and when.tzinfo is None:
                          when = when.replace(tzinfo=now.tzinfo)
                      if when and when > now:
                          future += 1
              print(f"live-{shard}: http={st} {ms}ms {size}B symbols={len(sym)}")
              if st != 200:
                  fails.append(shard)
          print("shard symbols total", len(seen), "unique", len(set(seen)), "match live.json", set(seen) == set(stocks))
          print("future candles", future)
          first = next(iter(stocks), None)
          if first:
              st, body, ms, _ = get(f"/public/stock/{first}.json")
              print(f"/public/stock/{first}.json http={st} {ms}ms keys={sorted(body)[:10]}")
          for path in ("/public/nifty.json", "/public/indicators.json", "/public/health.json"):
              try:
                  st, body, ms, size = get(path)
                  print(f"{path} http={st} {ms}ms {size}B status={body.get('status')}")
              except Exception as exc:
                  print(f"{path} FAILED {exc}")
                  fails.append(path)
          print("ACCEPTANCE", "FAIL" if fails or future or len(set(seen)) != len(seen) else "PASS", fails)
          PY
          sec "archive writes today"; ls -la /home/ubuntu/psygrid-data/$(TZ=Asia/Kolkata date +%F) 2>/dev/null || echo "no archive directory for today"
          sec "fd count after endpoint sweep"; ls /proc/$(systemctl show -p MainPID --value psygrid)/fd | wc -l
          # Isolation test already passed on 2026-10-04; skipped in market hours so psygridevents keeps running.
          RUN_ISOLATION=0
          if [ "$RUN_ISOLATION" = 1 ]; then
          sec "isolation: stop psygridevents, PSYGRID must keep serving"
          PID_BEFORE=$(systemctl show -p MainPID --value psygrid)
          sudo systemctl stop psygridevents || true
          sleep 5
          for i in 1 2 3; do curl -sS -m 5 -o /dev/null -w "psygrid /health http=%{http_code}\n" http://127.0.0.1:10000/health; curl -sS -m 10 -o /dev/null -w "psygrid live-a http=%{http_code}\n" http://127.0.0.1:10000/public/live-a.json; sleep 2; done
          echo "psygrid pid before=$PID_BEFORE after=$(systemctl show -p MainPID --value psygrid) (must match)"
          sudo systemctl start psygridevents || true
          sleep 5
          systemctl show psygridevents -p ActiveState -p MemoryMax -p CPUWeight -p OOMScoreAdjust -p IOSchedulingClass 2>/dev/null
          fi
          sec "market-hours sample"; curl -sS -m 15 http://127.0.0.1:10000/public/live-a.json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d.get("stocks") or {}
          print("session", d.get("session"), "status", d.get("status"), "stocks", len(s))
          for sym, rec in list(s.items())[:3]:
              c = rec.get("candles_1m") or []
              print(sym, "candles", len(c), "last", c[-1] if c else None)
          '
          sec "index ids in Dhan master (read-only)"; curl -sS -m 60 https://images.dhan.co/api-data/api-scrip-master.csv -o /tmp/master.csv && python3 - <<'PY'
          import csv
          for r in csv.DictReader(open("/tmp/master.csv")):
              if r.get("SEM_INSTRUMENT_NAME", "").upper() == "INDEX":
                  print(r.get("SEM_EXM_EXCH_ID"), r.get("SEM_SMST_SECURITY_ID"), r.get("SEM_TRADING_SYMBOL"), r.get("SM_SYMBOL_NAME"))
          PY
          rm -f /tmp/master.csv
          sec "served index values"; for k in nifty indiavix nifty500 finnifty; do curl -sS -m 8 http://127.0.0.1:10000/public/$k.json | python3 -c "import json,sys;d=json.load(sys.stdin);print('$k', d.get('symbol'), d.get('security_id'), d.get('ltp'))"; done
          sec "indicators.json error"; curl -sS -m 10 -o /dev/null -w "http=%{http_code}\n" http://127.0.0.1:10000/public/indicators.json
          sudo journalctl -u psygrid --since "-20 min" --no-pager | grep -B2 -A40 -m2 "Traceback" | tail -90
          sec "psygridevents market health"; curl -sS -m 8 http://127.0.0.1:10100/market/health | head -c 800; echo
          true
          REMOTE
