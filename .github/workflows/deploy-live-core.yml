name: PSYGRID Live Core Deploy (E2 Micro nodes)

# Deploys ONLY the Live Core (python -m live_core) to the two Oracle Always Free E2.1.Micro VMs.
# It never touches the full PSYGRID VM, psygrid.service or deploy-oracle.yml. Manual trigger only:
# a restart wipes a node's RAM-only session, so deploys are a deliberate act.
#
# Actions:
#   status   read-only: OS, Python, memory, the NAMES (never values) of the variables in
#            /etc/psygrid-live-core.env, systemd unit state, listeners and health on each node, port 10000
#            from the internet, and the cluster view from node 0. Changes nothing.
#   deploy   test, build the manifest-only bundle, install on the selected node(s), verify.
#
# Repository configuration:
#   secret   LIVE_CORE_NODE0_SSH_KEY        private key for node 0's VM (required to reach node 0)
#   secret   LIVE_CORE_NODE1_SSH_KEY        private key for node 1's VM (required to reach node 1)
#   The two VMs were created with different key pairs, so each node is reached only with its own key.
#   Keys live only in GitHub secrets and in a 0600 file on the runner for the length of one step.
#   variable LIVE_CORE_NODE0_HOST           public IP of node 0 (default 129.225.112.47)
#   variable LIVE_CORE_NODE1_HOST           public IP of node 1 (default 140.245.228.101)
#   variable LIVE_CORE_NODE0_PRIVATE_URL    optional, e.g. http://10.0.0.11:10000 (peer traffic inside the VCN)
#   variable LIVE_CORE_NODE1_PRIVATE_URL    optional; without them the nodes reach each other on the public IPs
#   variable LIVE_CORE_SSH_USER             optional; otherwise ubuntu, then opc, is tried
on:
  workflow_dispatch:
    inputs:
      action:
        description: status (read-only) or deploy
        type: choice
        options: [status, deploy, inspect-production]
        default: status
      target:
        description: Which node(s)
        type: choice
        options: [both, node0, node1]
        default: both
      allow_missing_credentials:
        description: Deploy even if /etc/psygrid-live-core.env has no Dhan credentials yet (nodes report CONFIG_ERROR)
        type: boolean
        default: false
      allow_market_hours:
        description: Deploy during 09:00-15:20 IST on a weekday (restarting a node drops its RAM session)
        type: boolean
        default: false

concurrency:
  group: deploy-live-core
  cancel-in-progress: false

env:
  NODE_COUNT: "2"
  PORT: "10000"
  NODE0_HOST: ${{ vars.LIVE_CORE_NODE0_HOST || '129.225.112.47' }}
  NODE1_HOST: ${{ vars.LIVE_CORE_NODE1_HOST || '140.245.228.101' }}

jobs:
  test:
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check live_core tests/live_core && ruff format --check live_core tests/live_core

      - name: Live Core tests and the shared feed/runtime-guard/contract tests
        run: >
          python -m pytest -q tests/live_core tests/test_runtime_guard.py tests/test_shard_contract.py
          tests/test_universe.py tests/test_live_safety.py tests/test_feed_timestamp.py

      - name: Build the Live Core bundle (manifest files only)
        run: |
          set -euo pipefail
          files="$(grep -v '^[[:space:]]*#' deploy/live-core/MANIFEST | sed '/^[[:space:]]*$/d')"
          for f in $files; do git ls-files --error-unmatch "$f" >/dev/null; done
          tar czf live-core.tgz $files
          tar tzf live-core.tgz
          if tar tzf live-core.tgz | grep -Eq '(^|/)app\.py$'; then echo "app.py must not ship"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: live-core-bundle
          path: live-core.tgz
          retention-days: 7

  operate:
    needs: test
    # status skips the test job; deploy requires it to pass.
    if: ${{ always() && inputs.action != 'inspect-production' && (needs.test.result == 'success' || (inputs.action == 'status' && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to restart nodes during the market session unless asked
        if: ${{ inputs.action == 'deploy' && !inputs.allow_market_hours }}
        run: |
          set -euo pipefail
          now="$(TZ=Asia/Kolkata date +%u%H%M)"
          day="${now:0:1}"; hhmm="${now:1}"
          if [ "$day" -le 5 ] && [ "$hhmm" -ge 0900 ] && [ "$hhmm" -lt 1520 ]; then
            echo "It is $(TZ=Asia/Kolkata date) - inside the equity session. Re-run with allow_market_hours to deploy anyway."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'deploy' }}
        with:
          name: live-core-bundle

      - name: ${{ inputs.action }} on the selected node(s)
        env:
          NODE0_SSH_KEY: ${{ secrets.LIVE_CORE_NODE0_SSH_KEY }}
          NODE1_SSH_KEY: ${{ secrets.LIVE_CORE_NODE1_SSH_KEY }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          SSH_USER_OVERRIDE: ${{ vars.LIVE_CORE_SSH_USER }}
          NODE0_URL: ${{ vars.LIVE_CORE_NODE0_PRIVATE_URL }}
          NODE1_URL: ${{ vars.LIVE_CORE_NODE1_PRIVATE_URL }}
          RELEASE: ${{ github.sha }}
          ALLOW_CONFIG_ERROR: ${{ inputs.allow_missing_credentials }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/live_core_node0 ~/.ssh/live_core_node1' EXIT
          [ -n "$NODE1_HOST" ] || { echo "node 1 host is empty"; exit 1; }
          health_flags=""
          if [ "$ALLOW_CONFIG_ERROR" = true ]; then health_flags="--allow-config-error"; fi

          # Write node N's key to its own file; fail early if the selected node has no key.
          install_key() {
            local node="$1" key="$2"
            if [ -z "$key" ]; then
              echo "secret LIVE_CORE_NODE${node}_SSH_KEY is not set; cannot reach node ${node}"
              exit 1
            fi
            ( umask 077 && printf '%s\n' "$key" > ~/.ssh/live_core_node"${node}" )
          }
          case "$TARGET" in both|node0) install_key 0 "$NODE0_SSH_KEY" ;; esac
          case "$TARGET" in both|node1) install_key 1 "$NODE1_SSH_KEY" ;; esac
          unset NODE0_SSH_KEY NODE1_SSH_KEY

          ssh_opts() { echo "-i $HOME/.ssh/live_core_node$1 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20"; }
          # The login user of an Oracle image: the configured one, else ubuntu, else opc.
          login_user() {
            local node="$1" host="$2" user
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
            for user in $SSH_USER_OVERRIDE ubuntu opc; do
              # shellcheck disable=SC2046
              if ssh $(ssh_opts "$node") "${user}@${host}" true 2>/dev/null; then echo "$user"; return 0; fi
            done
            echo "cannot log in to node ${node} (${host}) with LIVE_CORE_NODE${node}_SSH_KEY as ${SSH_USER_OVERRIDE:-} ubuntu or opc" >&2
            return 1
          }

          status_node() {
            local node="$1" host="$2" user
            echo "================ node ${node} (${host}) ================"
            user="$(login_user "$node" "$host")" || return 1
            echo "login user: ${user}"
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "NODE=${node} PORT=${PORT} bash -s" <<'REMOTE' || return 1
          set -u
          echo "== host"; hostname; . /etc/os-release && echo "$PRETTY_NAME"; uname -m
          echo "private IPs: $(hostname -I)"
          echo "== python"; for p in python3.12 python3.13 python3.11 python3; do command -v $p >/dev/null && $p -V; done
          echo "== memory"; free -m; swapon --show || true; nproc
          echo "== disk"; df -h / | tail -1
          echo "== /etc/psygrid-live-core.env (variable NAMES with a non-empty value only)"
          if sudo test -f /etc/psygrid-live-core.env; then
            sudo stat -c '%a %U:%G' /etc/psygrid-live-core.env
            sudo grep -E '^[[:space:]]*[A-Z_][A-Z0-9_]*=.+' /etc/psygrid-live-core.env | sed -E 's/^[[:space:]]*([A-Z0-9_]+)=.*/\1/' | sort || true
          else
            echo "(missing)"
          fi
          echo "== units"; systemctl list-units --all --no-pager 'psygrid*' || true
          for u in /etc/systemd/system/psygrid-live-core-node*.service; do [ -e "$u" ] && systemctl show "$(basename "$u")" -p ActiveState -p SubState -p NRestarts -p MemoryCurrent -p MainPID; done
          echo "== listeners on ${PORT}"; sudo ss -ltnpH "( sport = :${PORT} )" || true
          echo "== iptables INPUT"; sudo iptables -S INPUT 2>/dev/null | head -20 || true
          echo "== local health"
          curl -s --max-time 5 "http://127.0.0.1:${PORT}/health/node" | head -c 4000 || echo "(no answer)"; echo
          if [ -e "/etc/systemd/system/psygrid-live-core-node${NODE}.service" ]; then
            echo "== last log lines"; sudo journalctl -u "psygrid-live-core-node${NODE}" -n 25 --no-pager || true
          fi
          REMOTE
          }

          deploy_node() {
            local node="$1" host="$2" peers="$3" user
            echo "=== deploy node ${node} -> ${host} (peers: ${peers}) ==="
            # Called as `deploy_node ... || failed=...`, where set -e does not apply: check every step.
            user="$(login_user "$node" "$host")" || return 1
            local root="/home/${user}/psygrid-live-core"
            local dir="${root}/releases/${RELEASE}"
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "mkdir -p '${dir}'" || return 1
            # shellcheck disable=SC2046
            scp $(ssh_opts "$node") live-core.tgz "${user}@${host}:${dir}/live-core.tgz" || return 1
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "set -euo pipefail
              cd '${dir}' && tar xzf live-core.tgz && rm -f live-core.tgz
              sudo NODE_ID='${node}' NODE_COUNT='${NODE_COUNT}' APP_USER='${user}' LIVE_CORE_ROOT='${root}' \\
                   PORT='${PORT}' PEERS='${peers}' bash deploy/live-core/install.sh
              if ! python3 deploy/live-core/check_health.py node http://127.0.0.1:${PORT} \\
                   --expect-node '${node}' --node-count '${NODE_COUNT}' ${health_flags}; then
                sudo journalctl -u psygrid-live-core-node${node} -n 60 --no-pager
                exit 1
              fi" || return 1
          }

          # Peers talk over the VMs' private IPs when both are reachable by SSH (same VCN, no internet
          # egress); the PRIVATE_URL variables override this, the public IPs are the fallback.
          private_url() {
            local node="$1" host="$2" user ip
            user="$(login_user "$node" "$host" 2>/dev/null)" || return 1
            # shellcheck disable=SC2046
            ip="$(ssh $(ssh_opts "$node") "${user}@${host}" "hostname -I | awk '{print \$1}'" 2>/dev/null)" || return 1
            [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo "http://${ip}:${PORT}"
          }
          if [ "$ACTION" = deploy ]; then
            if [ -z "$NODE0_URL" ] && [ -f ~/.ssh/live_core_node0 ]; then NODE0_URL="$(private_url 0 "$NODE0_HOST" || true)"; fi
            if [ -z "$NODE1_URL" ] && [ -f ~/.ssh/live_core_node1 ]; then NODE1_URL="$(private_url 1 "$NODE1_HOST" || true)"; fi
          fi
          NODE0_URL="${NODE0_URL:-http://${NODE0_HOST}:${PORT}}"
          NODE1_URL="${NODE1_URL:-http://${NODE1_HOST}:${PORT}}"
          echo "peer URLs: node 0 ${NODE0_URL}, node 1 ${NODE1_URL}"

          # Every selected node is attempted even if an earlier one fails; the step fails at the end.
          failed=""
          for node in 0 1; do
            case "$TARGET" in both|node${node}) ;; *) continue ;; esac
            if [ "$node" = 0 ]; then host="$NODE0_HOST"; peers="1=${NODE1_URL}"; else host="$NODE1_HOST"; peers="0=${NODE0_URL}"; fi
            if [ "$ACTION" = deploy ]; then
              deploy_node "$node" "$host" "$peers" || failed="$failed $node"
            else
              status_node "$node" "$host" || failed="$failed $node"
            fi
          done
          if [ -n "$failed" ]; then echo "FAILED on node(s):$failed"; exit 1; fi

      - name: Verify from the internet (port, node health, cluster coverage, combined endpoint)
        if: ${{ always() }}
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
        run: |
          set -uo pipefail
          for host in "$NODE0_HOST" "$NODE1_HOST"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${host}:${PORT}/health/node" || true)"
            echo "public http://${host}:${PORT}/health/node -> HTTP ${code}"
          done
          status=0
          require=""
          if [ "$ACTION" = deploy ] && [ "$TARGET" = both ]; then require="--require-reachable"; fi
          python3 deploy/live-core/check_health.py cluster "http://${NODE0_HOST}:${PORT}" --wait-seconds 20 $require || status=1
          python3 deploy/live-core/check_health.py live "http://${NODE0_HOST}:${PORT}" --wait-seconds 20 || status=1
          exit $status

  # Read-only look at the full PSYGRID VM: private network, token configuration (variable NAMES
  # only, never values), Dhan connections in use, reachability of the Live Core nodes.
  inspect-production:
    if: ${{ inputs.action == 'inspect-production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect the full PSYGRID VM (read-only)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_KEY" || { echo "secret ORACLE_SSH_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/psygrid_oracle' EXIT
          ( umask 077 && printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/psygrid_oracle )
          unset ORACLE_SSH_KEY
          ssh-keyscan -H 140.245.226.102 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/psygrid_oracle -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            ubuntu@140.245.226.102 'bash -s' <<'REMOTE'
          set -u
          echo "== host"; hostname; echo "private IPs: $(hostname -I)"; nproc; free -m | head -2
          echo "== deployed commit"; git -C /home/ubuntu/Psygrid log --oneline -1 2>/dev/null || true
          echo "== env variable NAMES with a value (never values)"
          for f in /etc/psygrid.env /home/ubuntu/Psygrid/.env; do
            echo "-- $f"
            sudo grep -E '^[[:space:]]*(export[[:space:]]+)?[A-Z_][A-Z0-9_]*=.+' "$f" 2>/dev/null \
              | sed -E 's/^[[:space:]]*(export[[:space:]]+)?([A-Z0-9_]+)=.*/\2/' | sort || echo "(none)"
          done
          echo "== psygrid unit"; systemctl show psygrid -p ActiveState -p SubState -p MainPID -p NRestarts -p EnvironmentFiles -p ExecStart
          echo "== listeners"; sudo ss -ltnpH | awk '{print $4, $6}' | head -20
          pid="$(systemctl show psygrid -p MainPID --value)"
          echo "== psygrid established :443 connections by remote address"
          sudo ss -tnpH state established "( dport = :443 )" 2>/dev/null | grep "pid=${pid}," | awk '{print $4}' | sort | uniq -c || true
          echo "== reachability of the Live Core nodes from this VM"
          for url in http://10.0.0.215:10000/health/node http://10.0.0.165:10000/health/node \
                     http://129.225.112.47:10000/health/node http://140.245.228.101:10000/health/node; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)"; echo "$url -> ${code}"
          done
          echo "== routes"; ip route | head -5
          REMOTE

