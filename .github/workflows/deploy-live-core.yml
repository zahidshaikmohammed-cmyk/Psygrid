name: PSYGRID Live Core Deploy (E2 Micro nodes)

# Deploys ONLY the Live Core (python -m live_core) to the two Oracle Always Free E2.1.Micro VMs.
# It never touches the full PSYGRID VM, psygrid.service or deploy-oracle.yml. Manual trigger only:
# a restart wipes a node's RAM-only session, so deploys are a deliberate act.
#
# Actions:
#   status   read-only: OS, Python, memory, the NAMES (never values) of the variables in
#            /etc/psygrid-live-core.env, systemd unit state, listeners and health on each node, port 10000
#            from the internet, and the cluster view from node 0. Changes nothing.
#   deploy   test, build the manifest-only bundle, install on the selected node(s), verify.
#   rehearse off-hours dress rehearsal on each node against the real Dhan account, with the
#            service's own environment and the deployed code (deploy/live-core/rehearse.py): token
#            from the authority, data access, instruments, snapshot, WebSocket connect + subscribe,
#            a full feed replacement and bounded teardown. Never restarts or changes the service.
#
# Repository configuration:
#   secret   LIVE_CORE_NODE0_SSH_KEY        private key for node 0's VM (required to reach node 0)
#   secret   LIVE_CORE_NODE1_SSH_KEY        private key for node 1's VM (required to reach node 1)
#   The two VMs were created with different key pairs, so each node is reached only with its own key.
#   Keys live only in GitHub secrets and in a 0600 file on the runner for the length of one step.
#   variable LIVE_CORE_NODE0_HOST           public IP of node 0 (default 129.225.112.47)
#   variable LIVE_CORE_NODE1_HOST           public IP of node 1 (default 140.245.228.101)
#   variable LIVE_CORE_NODE0_PRIVATE_URL    optional, e.g. http://10.0.0.11:10000 (peer traffic inside the VCN)
#   variable LIVE_CORE_NODE1_PRIVATE_URL    optional; without them the nodes reach each other on the public IPs
#   variable LIVE_CORE_SSH_USER             optional; otherwise ubuntu, then opc, is tried
on:
  workflow_dispatch:
    inputs:
      action:
        description: status (read-only), rehearse (off-hours, read-only) or deploy
        type: choice
        options: [status, rehearse, index-test, option-probe, volume-rank, pattern-scan, pattern-mine, behaviour-discovery, behaviour-posthoc, history-probe, confirm-preflight, behaviour-confirm, deploy]
        default: status
      target:
        description: Which node(s)
        type: choice
        options: [both, node0, node1]
        default: both
      allow_missing_credentials:
        description: Deploy even if /etc/psygrid-live-core.env has no Dhan credentials yet (nodes report CONFIG_ERROR)
        type: boolean
        default: false
      allow_market_hours:
        description: Deploy during 09:00-15:20 IST on a weekday (restarting a node drops its RAM session)
        type: boolean
        default: false
      research_run_id:
        description: behaviour-posthoc only - the run id of a finished behaviour-discovery run
        type: string
        default: ""

concurrency:
  group: deploy-live-core
  cancel-in-progress: false

env:
  NODE_COUNT: "2"
  PORT: "10000"
  NODE0_HOST: ${{ vars.LIVE_CORE_NODE0_HOST || '129.225.112.47' }}
  NODE1_HOST: ${{ vars.LIVE_CORE_NODE1_HOST || '140.245.228.101' }}

jobs:
  test:
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check live_core tests/live_core && ruff format --check live_core tests/live_core

      - name: Live Core tests and the shared feed/runtime-guard/contract tests
        run: >
          python -m pytest -q tests/live_core tests/test_runtime_guard.py tests/test_shard_contract.py
          tests/test_universe.py tests/test_live_safety.py tests/test_feed_timestamp.py

      - name: Build the Live Core bundle (manifest files only)
        run: |
          set -euo pipefail
          files="$(grep -v '^[[:space:]]*#' deploy/live-core/MANIFEST | sed '/^[[:space:]]*$/d')"
          for f in $files; do git ls-files --error-unmatch "$f" >/dev/null; done
          tar czf live-core.tgz $files
          tar tzf live-core.tgz
          if tar tzf live-core.tgz | grep -Eq '(^|/)app\.py$'; then echo "app.py must not ship"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: live-core-bundle
          path: live-core.tgz
          retention-days: 7

  operate:
    needs: test
    # status skips the test job; deploy requires it to pass.
    if: ${{ always() && inputs.action != 'behaviour-discovery' && inputs.action != 'behaviour-posthoc' && inputs.action != 'behaviour-confirm' && (needs.test.result == 'success' || (inputs.action != 'deploy' && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to restart nodes (or rehearse) during the market session unless asked
        if: ${{ (inputs.action == 'deploy' && !inputs.allow_market_hours) || inputs.action == 'rehearse' || inputs.action == 'index-test' || inputs.action == 'option-probe' }}
        run: |
          set -euo pipefail
          now="$(TZ=Asia/Kolkata date +%u%H%M)"
          day="${now:0:1}"; hhmm="${now:1}"
          if [ "$day" -le 5 ] && [ "$hhmm" -ge 0900 ] && [ "$hhmm" -lt 1520 ]; then
            echo "It is $(TZ=Asia/Kolkata date) - inside the equity session. Re-run with allow_market_hours to deploy anyway."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        if: ${{ inputs.action == 'deploy' }}
        with:
          name: live-core-bundle

      - name: ${{ inputs.action }} on the selected node(s)
        env:
          NODE0_SSH_KEY: ${{ secrets.LIVE_CORE_NODE0_SSH_KEY }}
          NODE1_SSH_KEY: ${{ secrets.LIVE_CORE_NODE1_SSH_KEY }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          SSH_USER_OVERRIDE: ${{ vars.LIVE_CORE_SSH_USER }}
          NODE0_URL: ${{ vars.LIVE_CORE_NODE0_PRIVATE_URL }}
          NODE1_URL: ${{ vars.LIVE_CORE_NODE1_PRIVATE_URL }}
          RELEASE: ${{ github.sha }}
          ALLOW_CONFIG_ERROR: ${{ inputs.allow_missing_credentials }}
          # Node 0 is the account's only Dhan token generator (PIN + TOTP) and shares the token with
          # node 1 over the private network. Used only by deploy, to (re)write node 0's credentials;
          # never printed.
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/live_core_node0 ~/.ssh/live_core_node1' EXIT
          [ -n "$NODE1_HOST" ] || { echo "node 1 host is empty"; exit 1; }
          health_flags=""
          if [ "$ALLOW_CONFIG_ERROR" = true ]; then health_flags="--allow-config-error"; fi

          # Write node N's key to its own file; fail early if the selected node has no key.
          install_key() {
            local node="$1" key="$2"
            if [ -z "$key" ]; then
              echo "secret LIVE_CORE_NODE${node}_SSH_KEY is not set; cannot reach node ${node}"
              exit 1
            fi
            ( umask 077 && printf '%s\n' "$key" > ~/.ssh/live_core_node"${node}" )
          }
          case "$TARGET" in both|node0) install_key 0 "$NODE0_SSH_KEY" ;; esac
          case "$TARGET" in both|node1) install_key 1 "$NODE1_SSH_KEY" ;; esac
          unset NODE0_SSH_KEY NODE1_SSH_KEY

          ssh_opts() { echo "-i $HOME/.ssh/live_core_node$1 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"; }
          # The login user of an Oracle image: the configured one, else ubuntu, else opc.
          login_user() {
            local node="$1" host="$2" user
            ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
            for user in $SSH_USER_OVERRIDE ubuntu opc; do
              # shellcheck disable=SC2046
              if ssh $(ssh_opts "$node") "${user}@${host}" true 2>/dev/null; then echo "$user"; return 0; fi
            done
            echo "cannot log in to node ${node} (${host}) with LIVE_CORE_NODE${node}_SSH_KEY as ${SSH_USER_OVERRIDE:-} ubuntu or opc" >&2
            return 1
          }

          status_node() {
            local node="$1" host="$2" user
            echo "================ node ${node} (${host}) ================"
            user="$(login_user "$node" "$host")" || return 1
            echo "login user: ${user}"
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "NODE=${node} PORT=${PORT} bash -s" <<'REMOTE' || return 1
          set -u
          echo "== host"; hostname; . /etc/os-release && echo "$PRETTY_NAME"; uname -m
          echo "private IPs: $(hostname -I)"
          echo "== python"; for p in python3.12 python3.13 python3.11 python3; do command -v $p >/dev/null && $p -V; done
          echo "== memory"; free -m; swapon --show || true; nproc
          echo "== disk"; df -h / | tail -1
          echo "== /etc/psygrid-live-core.env (variable NAMES with a non-empty value only)"
          if sudo test -f /etc/psygrid-live-core.env; then
            sudo stat -c '%a %U:%G' /etc/psygrid-live-core.env
            sudo grep -E '^[[:space:]]*[A-Z_][A-Z0-9_]*=.+' /etc/psygrid-live-core.env | sed -E 's/^[[:space:]]*([A-Z0-9_]+)=.*/\1/' | sort || true
          else
            echo "(missing)"
          fi
          echo "== units"; systemctl list-units --all --no-pager 'psygrid*' || true
          for u in /etc/systemd/system/psygrid-live-core-node*.service; do [ -e "$u" ] && systemctl show "$(basename "$u")" -p ActiveState -p SubState -p NRestarts -p MemoryCurrent -p MainPID; done
          echo "== listeners on ${PORT}"; sudo ss -ltnpH "( sport = :${PORT} )" || true
          echo "== iptables INPUT"; sudo iptables -S INPUT 2>/dev/null | head -20 || true
          echo "== local health"
          curl -s --max-time 5 "http://127.0.0.1:${PORT}/health/node" | head -c 4000 || echo "(no answer)"; echo
          if [ -e "/etc/systemd/system/psygrid-live-core-node${NODE}.service" ]; then
            echo "== last log lines"; sudo journalctl -u "psygrid-live-core-node${NODE}" -n 25 --no-pager || true
          fi
          REMOTE
          }

          rehearse_node() {
            local node="$1" host="$2" user
            echo "================ rehearsal node ${node} (${host}) ================"
            user="$(login_user "$node" "$host")" || return 1
            local root="/home/${user}/psygrid-live-core"
            # shellcheck disable=SC2046
            scp $(ssh_opts "$node") deploy/live-core/rehearse.py "${user}@${host}:${root}/rehearse.py" || return 1
            # The service's own environment files, user and working directory; a separate transient
            # process that binds no port. The service keeps running untouched.
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "sudo systemd-run --quiet --wait --pipe --collect \
                --uid='${user}' --gid='${user}' -p WorkingDirectory='${root}/current' \
                -p EnvironmentFile=/etc/psygrid-live-core.env -p EnvironmentFile=-/etc/psygrid-live-core-node.env \
                -E LIVE_CORE_NODE_ID='${node}' -E LIVE_CORE_NODE_COUNT='${NODE_COUNT}' -E PYTHONUNBUFFERED=1 \
                -E PYTHONDONTWRITEBYTECODE=1 -p RuntimeMaxSec=600 \
                '${root}/venv/bin/python' '${root}/rehearse.py'; rc=\$?; rm -f '${root}/rehearse.py'; exit \$rc" || return 1
          }

          index_test_node() {
            local node="$1" host="$2" script="${3:-index_trap_test.py}" maxsec="${4:-1800}" extra="${5:-}" user
            echo "================ research script ${script} on node ${node} (RAM only, no orders) ================"
            user="$(login_user "$node" "$host")" || return 1
            local root="/home/${user}/psygrid-live-core"
            # shellcheck disable=SC2046
            scp $(ssh_opts "$node") deploy/live-core/${script} "${user}@${host}:${root}/${script}" || return 1
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "sudo systemd-run --quiet --wait --pipe --collect \
                --uid='${user}' --gid='${user}' -p WorkingDirectory='${root}/current' \
                -p EnvironmentFile=/etc/psygrid-live-core.env -p EnvironmentFile=-/etc/psygrid-live-core-node.env \
                -E LIVE_CORE_NODE_ID='${node}' -E LIVE_CORE_NODE_COUNT='${NODE_COUNT}' -E PYTHONUNBUFFERED=1 \
                -E PYTHONDONTWRITEBYTECODE=1 -E YEARS=4 ${extra} -p RuntimeMaxSec=${maxsec} -p MemoryMax=400M \
                '${root}/venv/bin/python' '${root}/${script}'; rc=\$?; rm -f '${root}/${script}'; exit \$rc" || return 1
          }

          # Node 0's Dhan credentials: from the DHAN_* secrets when set (written root-only, never echoed),
          # otherwise they must already be in its /etc/psygrid-live-core.env. A stale shared
          # DHAN_ACCESS_TOKEN is removed so the node generates its own.
          node0_credentials() {
            local host="$1" user="$2"
            if [ -n "${DHAN_CLIENT_ID}" ] && [ -n "${DHAN_PIN}" ] && [ -n "${DHAN_TOTP_SECRET}" ]; then
              # shellcheck disable=SC2046
              printf 'DHAN_CLIENT_ID=%s\nDHAN_PIN=%s\nDHAN_TOTP_SECRET=%s\n' "$DHAN_CLIENT_ID" "$DHAN_PIN" "$DHAN_TOTP_SECRET" \
                | ssh $(ssh_opts 0) "${user}@${host}" "sudo sh -c 'umask 077
                    f=/etc/psygrid-live-core.env; touch \$f
                    grep -vE \"^[[:space:]]*(DHAN_CLIENT_ID|DHAN_PIN|DHAN_TOTP_SECRET|DHAN_ACCESS_TOKEN|DHAN_TOKEN_VAR)=\" \$f > \$f.new || true
                    cat >> \$f.new; chown root:root \$f.new; chmod 600 \$f.new; mv \$f.new \$f'" || return 1
              echo "node 0 credentials written from the DHAN_* secrets"
            fi
            # shellcheck disable=SC2046
            ssh $(ssh_opts 0) "${user}@${host}" "for v in DHAN_CLIENT_ID DHAN_PIN DHAN_TOTP_SECRET; do
                sudo grep -Eq \"^[[:space:]]*\$v=.+\" /etc/psygrid-live-core.env || { echo \"node 0 has no \$v\"; exit 1; }; done" \
              || { echo "node 0 needs DHAN_CLIENT_ID, DHAN_PIN and DHAN_TOTP_SECRET (repository secrets or its env file)"; return 1; }
          }

          deploy_node() {
            local node="$1" host="$2" peers="$3" token_source="$4" token_generation="$5" share_clients="$6" user
            echo "=== deploy node ${node} -> ${host} (peers: ${peers}; token: generate=${token_generation} source=${token_source:-none}) ==="
            # Called as `deploy_node ... || failed=...`, where set -e does not apply: check every step.
            user="$(login_user "$node" "$host")" || return 1
            local root="/home/${user}/psygrid-live-core"
            local dir="${root}/releases/${RELEASE}"
            if [ "$token_generation" = 1 ]; then node0_credentials "$host" "$user" || return 1; fi
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "mkdir -p '${dir}'" || return 1
            # shellcheck disable=SC2046
            scp $(ssh_opts "$node") live-core.tgz "${user}@${host}:${dir}/live-core.tgz" || return 1
            # shellcheck disable=SC2046
            ssh $(ssh_opts "$node") "${user}@${host}" "set -euo pipefail
              cd '${dir}' && tar xzf live-core.tgz && rm -f live-core.tgz
              sudo NODE_ID='${node}' NODE_COUNT='${NODE_COUNT}' APP_USER='${user}' LIVE_CORE_ROOT='${root}' \\
                   PORT='${PORT}' PEERS='${peers}' TOKEN_SOURCE='${token_source}' TOKEN_GENERATION='${token_generation}' \\
                   TOKEN_SHARE_CLIENTS='${share_clients}' bash deploy/live-core/install.sh
              if ! python3 deploy/live-core/check_health.py node http://127.0.0.1:${PORT} \\
                   --expect-node '${node}' --node-count '${NODE_COUNT}' ${health_flags}; then
                sudo journalctl -u psygrid-live-core-node${node} -n 60 --no-pager
                exit 1
              fi" || return 1
          }

          # Peers talk over the VMs' private IPs when both are reachable by SSH (same VCN, no internet
          # egress); the PRIVATE_URL variables override this, the public IPs are the fallback.
          private_url() {
            local node="$1" host="$2" user ip
            user="$(login_user "$node" "$host" 2>/dev/null)" || return 1
            # shellcheck disable=SC2046
            ip="$(ssh $(ssh_opts "$node") "${user}@${host}" "hostname -I | awk '{print \$1}'" 2>/dev/null)" || return 1
            [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && echo "http://${ip}:${PORT}"
          }
          if [ "$ACTION" = deploy ]; then
            if [ -z "$NODE0_URL" ] && [ -f ~/.ssh/live_core_node0 ]; then NODE0_URL="$(private_url 0 "$NODE0_HOST" || true)"; fi
            if [ -z "$NODE1_URL" ] && [ -f ~/.ssh/live_core_node1 ]; then NODE1_URL="$(private_url 1 "$NODE1_HOST" || true)"; fi
          fi
          NODE0_IP="" NODE1_IP=""
          if [ "$ACTION" = deploy ]; then
            # The token is shared only over the private network: both private IPs are required.
            NODE0_IP="$(private_url 0 "$NODE0_HOST" | sed -E 's#^http://([0-9.]+):.*#\1#' || true)"
            NODE1_IP="$(private_url 1 "$NODE1_HOST" | sed -E 's#^http://([0-9.]+):.*#\1#' || true)"
            if ! [[ "$NODE0_IP" =~ ^10\.|^172\.|^192\.168\. ]] || ! [[ "$NODE1_IP" =~ ^10\.|^172\.|^192\.168\. ]]; then
              echo "cannot determine both nodes' private IPs (node 0: '${NODE0_IP}', node 1: '${NODE1_IP}')"; exit 1
            fi
            echo "token: node 0 (${NODE0_IP}) generates it and shares it with node 1 (${NODE1_IP})"
          fi
          NODE0_URL="${NODE0_URL:-http://${NODE0_HOST}:${PORT}}"
          NODE1_URL="${NODE1_URL:-http://${NODE1_HOST}:${PORT}}"
          echo "peer URLs: node 0 ${NODE0_URL}, node 1 ${NODE1_URL}"

          # Every selected node is attempted even if an earlier one fails; the step fails at the end.
          failed=""
          for node in 0 1; do
            case "$TARGET" in both|node${node}) ;; *) continue ;; esac
            if [ "$node" = 0 ]; then host="$NODE0_HOST"; peers="1=${NODE1_URL}"; else host="$NODE1_HOST"; peers="0=${NODE0_URL}"; fi
            if [ "$ACTION" = deploy ]; then
              if [ "$node" = 0 ]; then
                deploy_node 0 "$host" "$peers" "" 1 "${NODE1_IP}" || failed="$failed 0"
              else
                deploy_node 1 "$host" "$peers" "http://${NODE0_IP}:${PORT}" 0 "" || failed="$failed 1"
              fi
            elif [ "$ACTION" = rehearse ]; then
              rehearse_node "$node" "$host" || failed="$failed $node"
            elif [ "$ACTION" = index-test ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" || failed="$failed $node"; }
            elif [ "$ACTION" = option-probe ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" option_probe.py || failed="$failed $node"; }
            elif [ "$ACTION" = volume-rank ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" volume_rank.py || failed="$failed $node"; }
            elif [ "$ACTION" = pattern-scan ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" pattern_scan.py 4800 || failed="$failed $node"; }
            elif [ "$ACTION" = pattern-mine ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" pattern_mine.py 4800 || failed="$failed $node"; }
            elif [ "$ACTION" = history-probe ]; then
              [ "$node" = 0 ] && { index_test_node "$node" "$host" history_probe.py 300 || failed="$failed $node"; }
            elif [ "$ACTION" = confirm-preflight ]; then
              # no Dhan request and no token read: live-service health, node memory/CPU/load, request plan
              if [ "$node" = 0 ]; then
                echo "runner: $(nproc) CPUs, $(free -m | awk '/^Mem:/ {print $2 " MB total, " $7 " MB available"}')"
                index_test_node "$node" "$host" behaviour_fetch.py 120 "-E PREFLIGHT=1 -E START=2021-10-01 -E END=2026-10-12" || failed="$failed $node"
              fi
            else
              status_node "$node" "$host" || failed="$failed $node"
            fi
          done
          if [ -n "$failed" ]; then echo "FAILED on node(s):$failed"; exit 1; fi

      - name: Verify from the internet (port, node health, cluster coverage, combined endpoint)
        if: ${{ always() }}
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
        run: |
          set -uo pipefail
          for host in "$NODE0_HOST" "$NODE1_HOST"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${host}:${PORT}/health/node" || true)"
            echo "public http://${host}:${PORT}/health/node -> HTTP ${code}"
          done
          status=0
          require=""
          if [ "$ACTION" = deploy ] && [ "$TARGET" = both ]; then require="--require-reachable"; fi
          python3 deploy/live-core/check_health.py cluster "http://${NODE0_HOST}:${PORT}" --wait-seconds 20 $require || status=1
          python3 deploy/live-core/check_health.py live "http://${NODE0_HOST}:${PORT}" --wait-seconds 20 || status=1
          exit $status

  # Behaviour discovery (research, read-only): node 0 fetches candles with the token authority's token
  # (the token never leaves the node) and streams them over SSH straight into the analysis on this
  # runner; nothing raw is stored anywhere. Only aggregate statistics are committed to the branch.
  behaviour:
    if: ${{ inputs.action == 'behaviour-discovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install analysis dependencies
        run: python -m pip install numpy==2.3.3 pytest

      - name: Engine tests (causality, planted behaviour, null control)
        run: python -m pytest -q tests/test_behaviour.py

      - name: Fetch on node 0 and analyse here
        env:
          NODE0_SSH_KEY: ${{ secrets.LIVE_CORE_NODE0_SSH_KEY }}
          SSH_USER_OVERRIDE: ${{ vars.LIVE_CORE_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/live_core_node0' EXIT
          ( umask 077 && printf '%s\n' "$NODE0_SSH_KEY" > ~/.ssh/live_core_node0 )
          unset NODE0_SSH_KEY
          opts="-i $HOME/.ssh/live_core_node0 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ssh-keyscan -H "$NODE0_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          user=""
          for u in $SSH_USER_OVERRIDE ubuntu opc; do
            # shellcheck disable=SC2086
            if ssh $opts "${u}@${NODE0_HOST}" true 2>/dev/null; then user="$u"; break; fi
          done
          [ -n "$user" ] || { echo "cannot log in to node 0"; exit 1; }
          root="/home/${user}/psygrid-live-core"
          out="research/behaviour/results/run-${GITHUB_RUN_ID}"
          # shellcheck disable=SC2086
          scp $opts deploy/live-core/behaviour_fetch.py "${user}@${NODE0_HOST}:${root}/behaviour_fetch.py"
          # shellcheck disable=SC2086
          ssh $opts "${user}@${NODE0_HOST}" "sudo systemd-run --quiet --wait --pipe --collect \
              --uid='${user}' --gid='${user}' -p WorkingDirectory='${root}/current' \
              -p EnvironmentFile=/etc/psygrid-live-core.env -p EnvironmentFile=-/etc/psygrid-live-core-node.env \
              -E LIVE_CORE_NODE_ID=0 -E LIVE_CORE_NODE_COUNT=${NODE_COUNT} -E PYTHONUNBUFFERED=1 \
              -E PYTHONDONTWRITEBYTECODE=1 -E YEARS=4 -p RuntimeMaxSec=7200 -p MemoryMax=400M \
              '${root}/venv/bin/python' '${root}/behaviour_fetch.py'; rc=\$?; rm -f '${root}/behaviour_fetch.py'; exit \$rc" \
            | python -m research.behaviour.run --stream - --out "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Upload all results (including per-test tables)
        if: ${{ always() && env.OUT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-results-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 30

      - name: Commit aggregate results to the branch
        run: |
          set -euo pipefail
          rm -f "$OUT/all_tests.csv.gz" "$OUT/walk_forward_trades.csv.gz"
          git config user.name "psygrid-research"
          git config user.email "psygrid-research@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Behaviour discovery results (run ${GITHUB_RUN_ID}): aggregate statistics only"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done

  # Pre-registered confirmation (research, read-only; docs/research/behaviour/PREREGISTRATION.md).
  # Refuses inside weekday 08:45-15:45 IST, refuses if any pre-registered file differs from
  # prereg.lock, fetches 2021-10-01 .. 2026-10-12 1-minute candles on node 0 at low priority (the
  # fetcher stops on HTTP 429, a request cap, low node memory, live-service health or market hours)
  # and analyses them in this runner's RAM. Commits aggregates and integrity summaries only.
  behaviour-confirm:
    if: ${{ inputs.action == 'behaviour-confirm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse during the live service's market hours
        run: |
          set -euo pipefail
          now="$(TZ=Asia/Kolkata date +%u%H%M)"
          day="${now:0:1}"; hhmm="${now:1}"
          if [ "$day" -le 5 ] && [ "$hhmm" -ge 0845 ] && [ "$hhmm" -lt 1545 ]; then
            echo "It is $(TZ=Asia/Kolkata date) - inside 08:45-15:45 IST on a weekday. Run after 15:45 IST."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install analysis dependencies
        run: python -m pip install numpy==2.3.3 pytest requests

      - name: Verify the pre-registration lock
        run: python -m research.behaviour.lockcheck

      - name: Tests (frozen definitions, causality, execution, integrity audit, fetch safety)
        run: python -m pytest -q tests/test_behaviour.py tests/test_behaviour_prereg.py tests/test_behaviour_integrity.py tests/test_behaviour_fetch_safety.py

      - name: Runner resources
        run: |
          echo "runner: $(nproc) CPUs"; free -m
          avail="$(free -m | awk '/^Mem:/ {print $7}')"
          [ "$avail" -ge 5000 ] || { echo "runner has only ${avail} MB available; need 5000"; exit 1; }

      - name: Fetch on node 0 and analyse here
        env:
          NODE0_SSH_KEY: ${{ secrets.LIVE_CORE_NODE0_SSH_KEY }}
          SSH_USER_OVERRIDE: ${{ vars.LIVE_CORE_SSH_USER }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/live_core_node0' EXIT
          ( umask 077 && printf '%s\n' "$NODE0_SSH_KEY" > ~/.ssh/live_core_node0 )
          unset NODE0_SSH_KEY
          opts="-i $HOME/.ssh/live_core_node0 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          ssh-keyscan -H "$NODE0_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          user=""
          for u in $SSH_USER_OVERRIDE ubuntu opc; do
            # shellcheck disable=SC2086
            if ssh $opts "${u}@${NODE0_HOST}" true 2>/dev/null; then user="$u"; break; fi
          done
          [ -n "$user" ] || { echo "cannot log in to node 0"; exit 1; }
          root="/home/${user}/psygrid-live-core"
          out="research/behaviour/results/confirm-${GITHUB_RUN_ID}"
          echo "OUT=$out" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          scp $opts deploy/live-core/behaviour_fetch.py "${user}@${NODE0_HOST}:${root}/behaviour_fetch.py" || exit 1
          # Low priority on the node: CPU quota, nice, idle I/O; 150 MB memory cap (the fetch alone is killed if it exceeds it); 2 h hard limit.
          # shellcheck disable=SC2086
          ssh $opts "${user}@${NODE0_HOST}" "sudo systemd-run --quiet --wait --pipe --collect \
              --uid='${user}' --gid='${user}' -p WorkingDirectory='${root}/current' \
              -p EnvironmentFile=/etc/psygrid-live-core.env -p EnvironmentFile=-/etc/psygrid-live-core-node.env \
              -E LIVE_CORE_NODE_ID=0 -E LIVE_CORE_NODE_COUNT=${NODE_COUNT} -E PYTHONUNBUFFERED=1 \
              -E PYTHONDONTWRITEBYTECODE=1 -E START=2021-10-01 -E END=2026-10-12 -E MAX_REQUESTS=2600 \
              -E HEALTH_URL=http://127.0.0.1:${PORT}/health/node \
              -p RuntimeMaxSec=7200 -p MemoryMax=150M -p CPUQuota=50% -p Nice=10 -p IOSchedulingClass=idle \
              '${root}/venv/bin/python' '${root}/behaviour_fetch.py'; rc=\$?; rm -f '${root}/behaviour_fetch.py'; exit \$rc" \
            | python -m research.behaviour.confirm_run --stream - --out "$out"
          rc=("${PIPESTATUS[@]}")
          echo "fetch exit ${rc[0]}, analysis exit ${rc[1]}"
          [ "${rc[1]}" = 0 ] || exit 1

      - name: Upload the session audit and results
        if: ${{ always() && env.OUT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: confirm-results-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 30

      - name: Commit aggregates and integrity summaries (also when aborted)
        if: ${{ always() && env.OUT != '' }}
        run: |
          set -euo pipefail
          [ -f "$OUT/summary.json" ] || { echo "no summary written"; exit 0; }
          git config user.name "psygrid-research"
          git config user.email "psygrid-research@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Pre-registered confirmation run ${GITHUB_RUN_ID}: aggregates and integrity summaries only"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done

  # Post-hoc analysis of a finished behaviour-discovery run from its artifact (no market data fetched).
  behaviour-posthoc:
    if: ${{ inputs.action == 'behaviour-posthoc' && inputs.research_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install analysis dependencies
        run: python -m pip install numpy==2.3.3 pandas==2.3.2

      - uses: actions/download-artifact@v4
        with:
          name: behaviour-results-${{ inputs.research_run_id }}
          path: posthoc-in
          run-id: ${{ inputs.research_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-hoc analysis
        run: python -m research.behaviour.posthoc posthoc-in

      - name: Commit derived tables
        env:
          RID: ${{ inputs.research_run_id }}
        run: |
          set -euo pipefail
          out="research/behaviour/results/run-${RID}"
          mkdir -p "$out"
          cp posthoc-in/cost_sensitivity.json posthoc-in/walk_forward_breakdown.json posthoc-in/recurrence_summary.json \
             posthoc-in/recurring_with_holdout.csv posthoc-in/promising_hypotheses.csv "$out/"
          git config user.name "psygrid-research"
          git config user.email "psygrid-research@users.noreply.github.com"
          git add "$out"
          git commit -m "Behaviour discovery post-hoc tables (run ${RID}): aggregate statistics only"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
