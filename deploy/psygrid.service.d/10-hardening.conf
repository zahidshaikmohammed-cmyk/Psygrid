# PSYGRID is the market-data backbone: it restarts on any exit, is fed to the systemd watchdog only
# while it still answers HTTP within its descriptor and memory budget (runtime_guard.ServiceWatchdog),
# and wins every CPU, I/O and memory contest against downstream services on this VM.
# Installed by the deploy workflow as a drop-in; ExecStart and /etc/psygrid.env stay as they are.
[Unit]
After=network-online.target
Wants=network-online.target
# Never give up restarting the backbone; RestartSteps below backs off instead of hammering.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
RestartSteps=6
RestartMaxDelaySec=60
TimeoutStopSec=30
KillSignal=SIGTERM
Environment=PYTHONUNBUFFERED=1

WatchdogSec=150
NotifyAccess=main

LimitNOFILE=65536
Nice=-5
CPUWeight=1000
IOWeight=1000
MemoryLow=512M
OOMScoreAdjust=-800
