# The Live Core nodes (same private subnet) take this process's current Dhan token from
# GET /internal/dhan-token instead of logging in themselves: Dhan keeps one live token per client,
# so a second login would invalidate this process's token. Private IPs only; see token_share.py.
[Service]
Environment=PSYGRID_TOKEN_SHARE_CLIENTS=10.0.0.215,10.0.0.165
